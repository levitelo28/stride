<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#143a31"/><meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Stride — Your Marathon Companion</title>
<link rel="manifest" href="manifest.webmanifest"/><link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <a href="#today" class="brand" data-nav="today"><span class="brand-mark">↗</span><span>stride<span class="brand-dot">.</span><small>THE DAILY TRAINING APP</small></span></a>
    <div class="side-label">YOUR SPACE</div>
    <nav class="side-nav">
      <button class="nav-btn active" data-view="today"><span>⌂</span> Today</button>
      <button class="nav-btn" data-view="plan"><span>▦</span> My plan</button>
      <button class="nav-btn" data-view="food"><span>◉</span> Food journal</button>
      <button class="nav-btn" data-view="progress"><span>▥</span> Progress</button>
      <button class="nav-btn" data-view="settings"><span>⚙</span> Settings</button>
    </nav>
    <div class="sidebar-bottom"><div class="tiny-eyebrow">YOUR NEXT RACE</div><strong>LA Marathon 2027</strong><div id="side-countdown" class="muted">March 7, 2027</div><div class="mini-progress"><div id="side-progress"></div></div></div>
  </aside>
  <div class="app-main">
    <header class="topbar"><div><span class="top-label">YOUR MARATHON COMPANION</span><span id="top-section" class="top-title">Today</span></div><div class="topbar-right"><span id="sync-pill" class="status-pill">◉ Local-first</span><button class="round-btn" aria-label="Open settings" data-view="settings">⚙</button></div></header>
    <main id="main-content" class="main-content">
      <section id="view-today" class="view active"></section>
      <section id="view-plan" class="view"></section>
      <section id="view-food" class="view"></section>
      <section id="view-progress" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>
</div>
<nav class="mobile-nav" aria-label="Mobile navigation">
 <button data-view="today" class="mobile-link active"><span>⌂</span><small>Today</small></button>
 <button data-view="plan" class="mobile-link"><span>▦</span><small>Plan</small></button>
 <button data-view="food" class="mobile-link"><span>◉</span><small>Food</small></button>
 <button data-view="progress" class="mobile-link"><span>▥</span><small>Progress</small></button>
 <button data-view="settings" class="mobile-link"><span>⚙</span><small>Settings</small></button>
</nav>
<dialog id="modal"><div class="modal-inner"><button class="modal-close" id="close-modal" aria-label="Close dialog">×</button><div id="modal-content"></div></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="seed.js"></script><script src="app.js"></script>
</body></html>
